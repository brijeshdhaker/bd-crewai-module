[project]
name = "bd-crewai-module"
version = "0.1.0"
description = "bd-crewai-module using crewAI"
authors = [{ name = "Brijesh K Dhaker", email = "brijeshdhaker@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.3"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
bd_crewai_module = "com.example.ai.apps.crewai.main:run"
bd_crewai_run = "com.example.ai.apps.crewai.main:run"
bd_crewai_train = "com.example.ai.apps.crewai.main:train"
bd_crewai_replay = "com.example.ai.apps.crewai.main:replay"
bd_crewai_test = "com.example.ai.apps.crewai.main:test"
bd_crewai_run_with_trigger = "com.example.ai.apps.crewai.main:run_with_trigger"
#
mysql_chat_start_app = "com.example.ai.apps.mysql_chat.app_runner:start_app"
mysql_chat_start_services = "com.example.ai.apps.mysql_chat.app_runner:start_services"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main/py"]

[tool.crewai]
type = "crew"

[tool.setuptools.dynamic]
# Point to your requirements file
dependencies = {file = ["requirements.txt"]}
